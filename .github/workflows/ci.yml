name: CI

# Builds and tests the solution on every push and pull request, so problems surface before a version tag is pushed.

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: HardwareIds.NET
          path: HardwareIds.NET/bin/Release/*.nupkg
          if-no-files-found: error
